openapi: 3.1.0
info:
  title: Firely API
  version: 0.1.0
  description: Serie armonizada MODIS+VIIRS de puntos de calor. Atribución NASA FIRMS.
components:
  parameters:
    h3: {name: h3, in: query, schema: {type: string}, description: "Celdas H3 r6 separadas por coma"}
    bbox: {name: bbox, in: query, schema: {type: string}, description: "min_lon,min_lat,max_lon,max_lat"}
    lat: {name: lat, in: query, schema: {type: number}}
    lon: {name: lon, in: query, schema: {type: number}}
    radius_km: {name: radius_km, in: query, schema: {type: number}}
    admin: {name: admin, in: query, schema: {type: string}, description: "Código de estado o municipio"}
    from: {name: from, in: query, schema: {type: string, format: date}}
    to: {name: to, in: query, schema: {type: string, format: date}}
    burn_type: {name: burn_type, in: query, schema: {type: string, enum: [agricola, forestal, otro]}}
  schemas:
    Envelope:
      type: object
      required: [methodology_version, data_cutoff, attribution]
      properties:
        area: {type: object}
        methodology_version: {type: string, example: 1.0.0-qm-biome-month}
        data_cutoff: {type: string, format: date}
        attribution: {type: string, example: NASA FIRMS}
        harmonization_uncertainty:
          type: object
          properties:
            years_estimated: {type: array, items: {type: integer}}
            median_rel_error: {type: number}
    CalendarRow:
      type: object
      properties:
        year: {type: integer}
        month: {type: integer}
        count_harm: {type: number}
        frp_harm: {type: number}
        count_harm_lo: {type: number}
        count_harm_hi: {type: number}
        anomaly_ratio: {type: number}
        percentile: {type: number}
        return_period_years: {type: number}
        clear_frac: {type: number}
        count_harm_cloudcorr: {type: [number, 'null'], description: 'Vista opcional Coahuila; conteo / max(clear_frac, 0.30). Null si falta cobertura.'}
        cloud_coverage: {type: number, description: 'Fracción de celdas seleccionadas con dato de nubes.'}
        is_estimated: {type: boolean}
        source: {type: string, enum: [SP, NRT]}
        is_provisional: {type: boolean, description: 'True para NRT posterior al último mes científico.'}
        enso_phase: {type: string}
paths:
  /calendar:
    get:
      summary: Matriz años x meses
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/lat'}
        - {$ref: '#/components/parameters/lon'}
        - {$ref: '#/components/parameters/radius_km'}
        - {$ref: '#/components/parameters/admin'}
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {$ref: '#/components/parameters/burn_type'}
        - {name: metric, in: query, schema: {type: string, enum: [count, frp], default: count}}
        - {name: reference, in: query, schema: {type: string, enum: [median, mean], default: median}}
        - {name: cloud_corrected, in: query, schema: {type: boolean, default: false}, description: 'Incluye una vista corregida por nubes donde existe cobertura de Coahuila; conserva count_harm observado.'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      reference: {type: string}
                      rows: {type: array, items: {$ref: '#/components/schemas/CalendarRow'}}
  /animation/frames:
    get:
      summary: Fotogramas mensuales de 25 años en celdas H3 r4
      parameters:
        - {name: country, in: query, schema: {type: string, enum: [Mexico, Argentina, Uruguay, Chile, Paraguay, Bolivia, all], default: all}}
        - {name: res, in: query, schema: {type: integer, enum: [4], default: 4}}
      responses:
        '200':
          description: Un arreglo de valores por mes y celda, más escala máxima y meses estimados.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      months: {type: array, items: {type: string}}
                      cells: {type: array, items: {type: string}}
                      values: {type: array, items: {type: array, items: {type: number}}}
                      max: {type: number}
                      is_estimated_months: {type: array, items: {type: string}}
  /calendar/daily:
    get:
      summary: Valores diarios de un mes
      parameters:
        - {name: year, in: query, required: true, schema: {type: integer}}
        - {name: month, in: query, required: true, schema: {type: integer}}
      responses: {'200': {description: OK}}
  /hotspots.csv:
    get:
      summary: Puntos de calor en CSV (con metadatos y atribución)
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {$ref: '#/components/parameters/burn_type'}
        - {name: min_confidence, in: query, schema: {type: string, enum: [baja, nominal, alta]}}
      responses: {'200': {description: text/csv}}
  /events:
    get:
      summary: Eventos con ranking
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {name: active_only, in: query, schema: {type: boolean}}
        - {name: min_hotspots, in: query, schema: {type: integer, default: 3, minimum: 0}}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/lat'}
        - {$ref: '#/components/parameters/lon'}
        - {$ref: '#/components/parameters/radius_km'}
        - {$ref: '#/components/parameters/admin'}
      responses: {'200': {description: OK}}
  /analogs:
    get:
      summary: Años análogos y proyección
      parameters: [{name: date, in: query, schema: {type: string, format: date}}]
      responses: {'200': {description: OK}}
  /season: {get: {summary: Inicio/pico/fin por año y tendencias, responses: {'200': {description: OK}}}}
  /context:
    get:
      summary: Anomalías meteorológicas y fase ONI
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/lat'}
        - {$ref: '#/components/parameters/lon'}
        - {$ref: '#/components/parameters/radius_km'}
        - {$ref: '#/components/parameters/admin'}
      responses: {'200': {description: OK}}
  /admin/search:
    get:
      summary: Buscar unidades administrativas por nombre o código
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {description: Candidatos con código, nombre, país, padre y bbox}
  /reported:
    get:
      summary: Incendios CONAFOR mensuales frente a detecciones armonizadas del estado y año
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/lat'}
        - {$ref: '#/components/parameters/lon'}
        - {$ref: '#/components/parameters/radius_km'}
        - {$ref: '#/components/parameters/admin'}
      responses:
        '200': {description: Valores mensuales reportados, detecciones del estado y cobertura de datos por año}
  /hotspots.geojson:
    get:
      summary: Puntos FIRMS observados de confianza nominal o alta como GeoJSON
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {name: limit, in: query, schema: {type: integer, default: 20000, minimum: 1, maximum: 20000}}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/lat'}
        - {$ref: '#/components/parameters/lon'}
        - {$ref: '#/components/parameters/radius_km'}
        - {$ref: '#/components/parameters/admin'}
        - {name: geometry, in: query, schema: {type: string}}
      responses: {'200': {description: FeatureCollection con n_total y truncated}}
  /recurrence:
    get:
      summary: Años con al menos 1.0 detecciones equivalentes por celda H3 r6
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: geometry, in: query, schema: {type: string}}
      responses: {'200': {description: FeatureCollection de hasta 5000 celdas}}
  /territory:
    get:
      summary: Administración, localidades, áreas protegidas y cobertura del suelo
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: geometry, in: query, schema: {type: string}}
      responses: {'200': {description: Contexto territorial}}
  /risk:
    get:
      summary: Índice de prioridad v1 (0-100) con pesos ajustables por el usuario (§8.16) y componente FWI cuando hay datos
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: geometry, in: query, schema: {type: string}}
        - {name: w_anomaly, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.35}}
        - {name: w_recurrence, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.25}}
        - {name: w_exposure, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.25}}
        - {name: w_season, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.15}}
        - {name: w_fwi, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.15}}
      responses: {'200': {description: "Índice, nivel, componentes, weights, weights_custom y método"}}
  /watch:
    get:
      summary: Boletín mensual de unidades administrativas
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [mun, ent, adm1, adm2], default: mun}}
        - {name: country, in: query, schema: {type: string, default: Mexico}}
        - {name: top, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 100}}
      responses: {'200': {description: Ranking de anomalías por unidad}}
  /recent:
    get:
      summary: Detecciones NRT
      parameters: [{name: hours, in: query, schema: {type: integer, enum: [24, 48]}}]
      responses: {'200': {description: OK}}
  /alerts/cap: {get: {summary: Feed Atom con los borradores CAP 1.2 aprobados para ejercicio (status Exercise; nunca Actual), responses: {'200': {description: application/atom+xml}}}}
  /resolve-area:
    post:
      summary: Texto libre a intención estructurada y geometría candidata
      requestBody:
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}, lang: {type: string}}}}}
      responses: {'200': {description: "Intención (área, fechas) + candidatos si hay ambigüedad"}}
  /return-period:
    get:
      summary: Percentil empírico y periodo de retorno de un mes (1/(1-percentil), tope 50 años)
      parameters:
        - {name: year, in: query, required: true, schema: {type: integer}}
        - {name: month, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 12}}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
      responses: {'200': {description: "percentile, return_period_years, n de años de referencia"}}
  /weekday:
    get:
      summary: Día de la semana de inicio de los incendios (eventos, no puntos crudos) con chi-cuadrado
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
      responses: {'200': {description: "counts_monday_first, n_events, p_value, summary_es"}}
  /night:
    get:
      summary: Proporción de detecciones nocturnas VIIRS por año
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
      responses: {'200': {description: "rows por año: night_detections, total_detections, night_ratio"}}
  /export.kml:
    get:
      summary: Puntos armonizados en KML (atribución NASA FIRMS en la descripción)
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {name: limit, in: query, schema: {type: integer, default: 5000, minimum: 1, maximum: 20000}}
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/lat'}
        - {$ref: '#/components/parameters/lon'}
        - {$ref: '#/components/parameters/radius_km'}
        - {$ref: '#/components/parameters/admin'}
      responses: {'200': {description: application/vnd.google-earth.kml+xml}}
  /ogc:
    get: {summary: OGC API Features - landing, responses: {'200': {description: links}}}
  /ogc/conformance:
    get: {summary: OGC API Features - conformance, responses: {'200': {description: conformsTo}}}
  /ogc/collections:
    get: {summary: "OGC API Features - colecciones (events, cell_activity)", responses: {'200': {description: collections}}}
  /ogc/collections/{collectionId}:
    get:
      summary: OGC API Features - una colección
      parameters:
        - {name: collectionId, in: path, required: true, schema: {type: string, enum: [events, cell_activity]}}
      responses: {'200': {description: collection}, '404': {description: no existe}}
  /ogc/collections/{collectionId}/items:
    get:
      summary: OGC API Features - items como application/geo+json (events con n_hotspots_harm>=3; cell_activity con count_harm)
      parameters:
        - {name: collectionId, in: path, required: true, schema: {type: string, enum: [events, cell_activity]}}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 1000}}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
        - {name: bbox, in: query, schema: {type: string}, description: "west,south,east,north"}
        - {name: datetime, in: query, schema: {type: string}, description: "instante o intervalo RFC 3339 (a/b, ../b, a/..)"}
      responses: {'200': {description: FeatureCollection con numberMatched, attribution, methodology_version, data_cutoff}}
  /sql:
    post:
      summary: SQL de solo lectura (un SELECT, sin ';') sobre las vistas cell_month_harmonized, events y climatology; máx. 1000 filas y 15 s
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [query], properties: {query: {type: string}}}}}
      responses: {'200': {description: "columns, rows, query, truncated, views"}, '400': {description: "Consulta rechazada o con error"}, '408': {description: "Tiempo agotado"}}
  /bulletin:
    get:
      summary: Boletín semanal del agente vigía (plantilla determinista sobre /risk, /watch y la serie)
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {name: polish, in: query, schema: {type: boolean, default: false}, description: "Pule el texto con LLM si hay ANTHROPIC_API_KEY; las cifras no cambian"}
      responses: {'200': {description: "title, sections[], sources[], generated_by"}}
  /cap/draft:
    post:
      summary: Borrador CAP 1.2 (status Exercise, aprobación pendiente; nada se publica)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [area, text], properties: {area: {}, text: {type: string}, severity: {type: string, enum: [Minor, Moderate, Severe, Extreme]}}}}}
      responses: {'200': {description: "draft con id, xml, status Exercise, approval borrador"}}
  /cap/approve/{draft_id}:
    post:
      summary: Marca el borrador como aprobado_para_ejercicio (status sigue Exercise, nunca Actual)
      parameters:
        - {name: draft_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: "draft actualizado"}, '404': {description: "No existe"}}
  /cap/drafts:
    get:
      summary: Lista de borradores CAP
      responses: {'200': {description: "drafts"}}
  /spread:
    get:
      summary: Cono de propagación orientativo (±22.5°) según viento Open-Meteo; no es pronóstico oficial
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: event_id, in: query, schema: {type: string}}
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 72, default: 24}}
      responses: {'200': {description: "wind, direction, reach_km, cone (GeoJSON Feature)"}, '503': {description: "wind_unavailable"}}
  /wind-localities:
    get:
      summary: Localidades a favor del viento (sector ±22.5°), por población
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: event_id, in: query, schema: {type: string}}
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 72, default: 24}}
      responses: {'200': {description: "localities con distance_km y bearing_deg, sector"}, '503': {description: "wind_unavailable"}}
  /regimes:
    get:
      summary: Régimen de fuego por celda y cambio 2001-2012 vs 2013-2026 (GeoJSON H3)
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
      responses: {'200': {description: "regime_counts, change, FeatureCollection con regime_class y changed"}}
  /weather:
    get:
      summary: Contexto meteorológico NASA POWER (§8.10) - anomalías de precipitación, temperatura, humedad y viento junto a la anomalía de fuego
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: radius_km, in: query, schema: {type: number}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: year, in: query, description: Con month, agrega una frase resumen del mes, schema: {type: integer}}
        - {name: month, in: query, schema: {type: integer, minimum: 1, maximum: 12}}
      responses: {'200': {description: "rows (anomalías + fire_anomaly_ratio), climatology, summary"}, '503': {description: power_unavailable}}
  /reports/extract:
    post:
      summary: Extracción de reportes oficiales (§11.2) - texto pegado de un PDF/tabla a registros validados; no guarda ni publica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 60000}
                source_label: {type: string}
                use_llm: {type: boolean, default: true}
      responses: {'200': {description: "records (con issues y needs_review), checks contra totales, csv"}, '422': {description: texto vacío o demasiado largo}}
  /drill:
    get:
      summary: Escenario de simulacro (§11.2) por etapas con un evento histórico real del área; texto por plantilla
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: event_id, in: query, schema: {type: string}}
        - {name: min_hotspots, in: query, schema: {type: integer, minimum: 3, default: 10}}
        - {name: pick, in: query, schema: {type: string, enum: [largest, longest, recent], default: largest}}
      responses: {'200': {description: "event, stages (deteccion, exposicion, evolucion, desenlace), disclaimer"}, '404': {description: sin eventos}}
  /risk/forecast:
    get:
      summary: Riesgo próximo (§8.11) - FWI del pronóstico GFWED GEOS-5 de 8 días sobre el área, comparado con la climatología mensual; frase "esta semana el peligro meteorológico es X"
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: radius_km, in: query, schema: {type: number}}
        - {name: geometry, in: query, schema: {type: string}}
      responses: {'200': {description: "forecast_run, stale, days (fwi_mean, fwi_ltm, ratio_ltm, effis_class), level, climatology (basis longterm_mean | history_percentile | effis_absolute), summary_es"}, '503': {description: gfwed_forecast_unavailable}}
  /priority/cells:
    get:
      summary: Índice de prioridad por celda H3 r6 (§8.16), mismos componentes y pesos que /risk; GeoJSON y top 10
      parameters:
        - {$ref: '#/components/parameters/h3'}
        - {$ref: '#/components/parameters/bbox'}
        - {$ref: '#/components/parameters/admin'}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: radius_km, in: query, schema: {type: number}}
        - {name: geometry, in: query, schema: {type: string}}
        - {name: w_anomaly, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.35}}
        - {name: w_recurrence, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.25}}
        - {name: w_exposure, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.25}}
        - {name: w_season, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.15}}
        - {name: w_fwi, in: query, schema: {type: number, minimum: 0, maximum: 10, default: 0.15}}
      responses: {'200': {description: "FeatureCollection (h3, index, level, components, current_count, population_10km), top10, period, weights, method"}, '422': {description: area_too_large (más de 3000 celdas)}}
  /subscriptions:
    get:
      summary: Suscripciones de alerta (§10.1); el chat_id se devuelve enmascarado
      responses: {'200': {description: rows}}
    post:
      summary: Crea una suscripción (área, umbral, chat de Telegram). Queda pendiente de aprobación humana; los mensajes son de ejercicio/prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, area, chat_id]
              properties:
                name: {type: string, maxLength: 80}
                area:
                  type: object
                  properties:
                    h3: {type: string}
                    bbox: {type: string}
                    lat: {type: number}
                    lon: {type: number}
                    radius_km: {type: number}
                    admin: {type: string}
                chat_id: {type: integer}
                min_index: {type: number, minimum: 0, maximum: 100, default: 55}
                min_anomaly_ratio: {type: number, exclusiveMinimum: 0}
                lang: {type: string, enum: [es, en, pt], default: es}
      responses: {'201': {description: "subscription (approved=false)"}, '422': {description: área inválida o vacía}}
  /subscriptions/{sub_id}:
    delete:
      summary: Borra una suscripción
      parameters:
        - {name: sub_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: deleted}, '404': {description: no existe}}
