# docker compose up --build        ->  http://localhost:8080
# Data: the API reads Parquet from FIRELY_DATA_PROCESSED (default ./data/processed), mounted read-only.
services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    image: firely-api:latest
    restart: unless-stopped
    environment:
      FIRELY_API_MODE: real
      # optional keys; leave unset and the features degrade gracefully (see .env.example)
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIRELY_LLM_MODEL: ${FIRELY_LLM_MODEL:-}
      # writable state (CAP drafts approved for exercise, NASA POWER cache); the data stays read-only
      FIRELY_STATE_DIR: /state
    volumes:
      - ${FIRELY_DATA_PROCESSED:-./data/processed}:/data/processed:ro
      - firely-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    expose:
      - "8000"
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_URL: /api
    image: firely-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FIRELY_PORT:-8080}:80"

volumes:
  firely-state:
