# Per-IP request limit for the API (the plan asked for one). 10 req/s, bursts of 40.
limit_req_zone $binary_remote_addr zone=firely_api:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req zone=firely_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # hashed build assets never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # the entry point and the generated methodology JSON must always be revalidated
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /data/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # single-page app: hash routes need no rewrite, but deep links to files fall back to the shell
  location / { try_files $uri /index.html; }
}
