# Firely site: shared by the HTTP server (default.conf) and the HTTPS server (tls.conf.example).
root /usr/share/nginx/html;
index index.html;
include /etc/nginx/mime.types;
types { text/javascript mjs; }

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/csv;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location /api/ {
  limit_req zone=firely_api burst=40 nodelay;
  limit_req_status 429;
  proxy_pass http://api:8000/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $firely_proto;
  proxy_read_timeout 90s;
}

# Public MCP server (streamable HTTP, container `mcp`). Resolved at request time through Docker's DNS, so the
# site still starts when the mcp service is not running (then /mcp answers 502).
location ~ ^/mcp/?$ {
  limit_req zone=firely_mcp burst=40 nodelay;
  limit_req_status 429;
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $firely_mcp http://mcp:8001;
  rewrite ^ /mcp break;
  proxy_pass $firely_mcp;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $firely_proto;
  proxy_set_header Connection "";
  # server-sent events: never buffer, keep the stream open long enough for slow tools
  proxy_buffering off;
  proxy_cache off;
  proxy_request_buffering off;
  chunked_transfer_encoding on;
  gzip off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  client_max_body_size 1m;
}

# hashed build assets never change
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}
# the entry point and the generated methodology JSON must always be revalidated
location = /index.html { add_header Cache-Control "no-cache"; }
location /data/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

# single-page app: hash routes need no rewrite, but deep links to files fall back to the shell
location / { try_files $uri /index.html; }
