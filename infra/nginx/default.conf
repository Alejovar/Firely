# Per-IP request limit for the API (the plan asked for one). 10 req/s, bursts of 40.
limit_req_zone $binary_remote_addr zone=firely_api:10m rate=10r/s;
# Same limit for the public MCP server (each tool call is one POST to /mcp).
limit_req_zone $binary_remote_addr zone=firely_mcp:10m rate=10r/s;

# Behind Cloudflare: take the visitor's IP from CF-Connecting-IP, so the limits above count visitors and not
# Cloudflare's edge servers. Only trusted when the request comes from a Cloudflare range.
include /etc/nginx/firely/cloudflare-realip.conf;

# Scheme the visitor used: Cloudflare sends X-Forwarded-Proto; direct requests use the connection's scheme.
map $http_x_forwarded_proto $firely_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80 default_server;
  server_name _;

  # Let's Encrypt HTTP-01 challenges (certbot --webroot on the host writes here)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  include /etc/nginx/firely/site.conf;
}

# HTTPS server: enabled on the host by copying tls.conf.example into infra/tls-enabled/ once the certificate
# exists (see infra/README.md, "Dominio y HTTPS"). An empty folder means HTTP only.
include /etc/nginx/firely/tls/*.conf;
