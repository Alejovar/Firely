name: firely-dev

services:
  mobile:
    build:
      context: .
      dockerfile: infra/docker/mobile.Dockerfile
    ports:
      - "${FIRELY_BIND_ADDRESS:-0.0.0.0}:${FIRELY_MOBILE_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    image: firely-api:latest
    restart: unless-stopped
    environment:
      FIRELY_API_MODE: real
      # optional keys; leave unset and the features degrade gracefully (see .env.example)
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIRELY_LLM_MODEL: ${FIRELY_LLM_MODEL:-}
    volumes:
      - ${FIRELY_DATA_PROCESSED:-./data/processed}:/data/processed:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    expose:
      - "8000"
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_URL: /api
    image: firely-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FIRELY_PORT:-8080}:80"
